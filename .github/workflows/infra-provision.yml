name: Infra Provision

on:
  workflow_call:
    outputs:
      instance_public_ip:
        description: IP público da instância provisionada
        value: ${{ jobs.infra_oci_production.outputs.instance_public_ip }}

  workflow_dispatch:

env:
  TF_VAR_backend_bucket: ${{ secrets.BACKEND_BUCKET}}
  TF_VAR_backend_key: ${{ secrets.BACKEND_KEY }}
  TF_VAR_namespace: ${{ secrets.NAMESPACE }} 
  TF_VAR_region: ${{ secrets.REGION }}
  TF_VAR_tenancy_ocid: ${{ secrets.TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.PRIVATE_KEY }}
  TF_VAR_private_key_password: ${{ secrets.PRIVATE_KEY_PASSWORD }}
  TF_VAR_compartment_name: ${{ secrets.COMPARTMENT_NAME }}
  TF_VAR_vcn_cidr_blocks: ${{ secrets.VCN_CIDR_BLOCKS }}
  TF_VAR_vcn_display_name: ${{ secrets.VCN_DISPLAY_NAME }}
  TF_VAR_vcn_dns_label: ${{ secrets.VCN_DNS_LABEL }}
  TF_VAR_public_subnet_cidr_block: ${{ secrets.PUBLIC_SUBNET_CIDR_BLOCK }}
  TF_VAR_http_port: ${{ secrets.HTTP_PORT }}
  TF_VAR_https_port: ${{ secrets.HTTPS_PORT }}
  TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
  TF_VAR_instance_availability_domain: ${{ secrets.INSTANCE_AVAILABILITY_DOMAIN }}
  TF_VAR_instance_shape: ${{ secrets.INSTANCE_SHAPE }}
  TF_VAR_instance_display_name: ${{ secrets.INSTANCE_DISPLAY_NAME }}
  TF_VAR_instance_create_vnic_details_hostname_label: ${{ secrets.INSTANCE_CREATE_VNIC_DETAILS_HOSTNAME_LABEL }}
  TF_VAR_operating_system: ${{ secrets.OPERATING_SYSTEM }}
  TF_VAR_operating_system_version: ${{ secrets.OPERATING_SYSTEM_VERSION }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

defaults:
  run:
    working-directory: ./terraform

jobs:
  infra_oci_production:
    runs-on: ubuntu-latest

    outputs:
      instance_public_ip: ${{ steps.tf_output.outputs.public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$TF_VAR_backend_bucket" \
            -backend-config="key=$TF_VAR_backend_key" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="namespace=$TF_VAR_namespace" \
            -backend-config="private_key=$TF_VAR_private_key" \
            -backend-config="private_key_password=$TF_VAR_private_key_password" \

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform output
        id: tf_output
        run: echo "public_ip=$(terraform output -raw oci_production_public_ip)" >> "$GITHUB_OUTPUT"
