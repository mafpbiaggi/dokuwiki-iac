---
- name: Get docker image
  community.docker.docker_image_pull:
    name: "{{ docker_image }}"
    pull: "always"
  diff: true
  become: true
  tags: [deploy, get_docker_img]

- name: Create network
  community.docker.docker_network:
    name: "{{ network_name }}"
  become: true
  tags: [deploy, create_docker_network]

- name: Create/Start container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}"
    restart_policy: "always"
    networks:
      - name: "{{ network_name }}"
    volumes:
      - "{{ volume_conf_name }}:{{ container_conf_dir }}"
      - "{{ volume_data_name }}:{{ container_data_dir }}"
  become: true
  tags: [deploy, docker_run]
